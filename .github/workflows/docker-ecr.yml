name: Deploy to AWS ECR

on:
  release:
    types: [published, released]

env:
  REGISTRY_ECR: 660644769541.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME_ECR: /blues-dev/blues-expert-mcp

jobs:
  # Deploy to AWS ECR when a versioned GitHub Release is published. AppRunner
  # auto-deploys the `latest` tag, so `latest` is pushed here (in addition to
  # the semver tags) to trigger the deploy. Prereleases skip `latest`.
  # Publishing a full release fires both `published` and `released`, so full
  # releases (including a prerelease promoted later) run only on `released`.
  ecr:
    if: github.event.action == 'released' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::660644769541:role/blues-expert-mcp-github
          role-session-name: GitHubActions
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_ECR }}${{ env.IMAGE_NAME_ECR }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./blues-expert/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
