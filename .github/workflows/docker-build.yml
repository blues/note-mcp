name: Build Docker Image (PR)

on:
  pull_request:
    branches: [ main ]

# Cancel superseded runs for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate the container build on pull requests WITHOUT pushing anywhere.
  # audit.yml only runs `go build`/`go vet`, so this is the only check that
  # exercises the Dockerfile (and the VERSION build-arg wiring) before a merge.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./blues-expert/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
